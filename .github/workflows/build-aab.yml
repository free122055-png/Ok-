name: Build Signed Android AAB & APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-aab-apk:
    name: Build & Sign AAB and APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Node Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Production Bundle
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Complete Resource Sanitize
        run: |
          echo "=== Sanitizing and generating valid Android images ==="
          sudo apt-get update && sudo apt-get install -y imagemagick

          # 1. Clear duplicate pngs in anydpi-v26
          rm -rf android/app/src/main/res/mipmap-anydpi-v26/*.png

          # 2. Re-create valid icons for all mipmap directories
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            dir="android/app/src/main/res/mipmap-$density"
            mkdir -p "$dir"
            convert -size 192x192 xc:"#3880ff" -fill white -draw "circle 96,96 96,20" PNG32:"$dir/ic_launcher.png"
            convert -size 192x192 xc:"#3880ff" -fill white -draw "circle 96,96 96,20" PNG32:"$dir/ic_launcher_round.png"
            convert -size 192x192 xc:none -fill white -draw "circle 96,96 96,20" PNG32:"$dir/ic_launcher_foreground.png"
          done

          # 3. Fix all splash files across all drawables
          find android/app/src/main/res -name "*splash*.png" | while read -r splash_file; do
            echo "Sanitizing splash: $splash_file"
            convert -size 480x800 xc:"#1a1b1f" PNG32:"$splash_file"
          done

      - name: Inject Official Play Store Keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "=== Injecting Official Play Store Keystore ==="
          mkdir -p android/app
          node -e "
          const fs = require('fs');
          const b64 = process.env.RELEASE_KEYSTORE_BASE64;
          if (!b64 || b64.length < 20) {
            console.error('CRITICAL ERROR: RELEASE_KEYSTORE_BASE64 secret is missing or invalid!');
            process.exit(1);
          }
          try {
            const buf = Buffer.from(b64.trim(), 'base64');
            if (buf.length < 100) {
              console.error('CRITICAL ERROR: Decoded keystore is too small! Size:', buf.length);
              process.exit(1);
            }
            fs.writeFileSync('android/app/release.keystore', buf);
            console.log('Keystore written successfully. Size:', buf.length, 'bytes');
          } catch (e) {
            console.error('CRITICAL ERROR: Failed to decode base64 or write file:', e.message);
            process.exit(1);
          }
          "

      - name: Verify Keystore and Alias
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          STOREPASS="${RELEASE_KEYSTORE_PASSWORD:-almayadin123}"
          ALIAS="${RELEASE_KEY_ALIAS:-almayadin}"
          
          echo "=== Verifying Keystore Integrity ==="
          # This step will fail the build if the password is wrong or keystore is invalid
          keytool -list -keystore android/app/release.keystore -storepass "$STOREPASS" -v > keystore_info.txt
          
          if grep -q "Alias name: $ALIAS" keystore_info.txt; then
            echo "SUCCESS: Alias '$ALIAS' found in keystore."
          else
            echo "CRITICAL ERROR: Alias '$ALIAS' NOT found in keystore!"
            echo "Available aliases:"
            grep "Alias name:" keystore_info.txt
            exit 1
          fi

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x android/gradlew

      - name: Build Android Unsigned AAB and APK
        run: |
          cd android
          echo "=== Starting Gradle Build (Unsigned) ==="
          ./gradlew bundleRelease assembleRelease --no-daemon -Pandroid.suppressUnsupportedCompileSdk=36

      - name: Sign Artifacts (Strict)
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          # Use absolute path to avoid ambiguity
          KEYSTORE_PATH="$GITHUB_WORKSPACE/android/app/release.keystore"
          STOREPASS="${RELEASE_KEYSTORE_PASSWORD:-almayadin123}"
          ALIAS="${RELEASE_KEY_ALIAS:-almayadin}"
          KEYPASS="${RELEASE_KEY_PASSWORD:-almayadin123}"

          echo "=== Manual Signing Started ==="
          
          # 1. Sign AAB
          AAB_FILE=$(find android/app/build/outputs/bundle/release -name "*.aab" | head -n 1)
          if [ -z "$AAB_FILE" ]; then
            echo "ERROR: AAB file not found!"
            exit 1
          fi
          
          echo "Signing AAB: $AAB_FILE"
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore "$KEYSTORE_PATH" \
            -storepass "$STOREPASS" \
            -keypass "$KEYPASS" \
            "$AAB_FILE" "$ALIAS"
          
          echo "Verifying AAB Signature..."
          jarsigner -verify -verbose -certs "$AAB_FILE" | grep -i "jar verified"
          if [ $? -ne 0 ]; then
            echo "CRITICAL ERROR: AAB Signature Verification FAILED!"
            exit 1
          fi

          # 2. Sign APK
          APK_FILE=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "ERROR: APK file not found!"
            exit 1
          fi
          
          echo "Signing APK: $APK_FILE"
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore "$KEYSTORE_PATH" \
            -storepass "$STOREPASS" \
            -keypass "$KEYPASS" \
            "$APK_FILE" "$ALIAS"
          
          echo "Verifying APK Signature..."
          jarsigner -verify -verbose -certs "$APK_FILE" | grep -i "jar verified"
          if [ $? -ne 0 ]; then
            echo "CRITICAL ERROR: APK Signature Verification FAILED!"
            exit 1
          fi

          echo "=== Signing and Verification Completed Successfully ==="
          
          mkdir -p final-artifacts
          cp "$AAB_FILE" final-artifacts/app-release.aab
          cp "$APK_FILE" final-artifacts/app-release.apk

      - name: Upload Signed AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Release-AAB
          path: final-artifacts/app-release.aab
          retention-days: 30

      - name: Upload Signed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Release-APK
          path: final-artifacts/app-release.apk
          retention-days: 30
