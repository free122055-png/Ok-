name: Build Signed Android AAB & APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-aab-apk:
    name: Build & Sign AAB and APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Node Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Production Bundle
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x android/gradlew

      - name: Build Signed AAB and APK
        run: |
          cd android
          echo "=== Building Signed Artifacts ==="
          ./gradlew clean bundleRelease assembleRelease --no-daemon -Pandroid.suppressUnsupportedCompileSdk=36

      - name: Prepare Artifacts
        run: |
          mkdir -p final-artifacts
          cp android/app/build/outputs/bundle/release/*.aab final-artifacts/app-release.aab || true
          cp android/app/build/outputs/apk/release/*.apk final-artifacts/app-release.apk || true

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Release-Builds
          path: final-artifacts/
          retention-days: 30
