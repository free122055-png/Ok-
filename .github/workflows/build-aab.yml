name: Build Signed Android AAB & APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-aab-apk:
    name: Build & Sign AAB and APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Node Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Production Bundle
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Complete Resource Sanitize
        run: |
          echo "=== Sanitizing and generating valid Android images ==="
          sudo apt-get update && sudo apt-get install -y imagemagick
          rm -rf android/app/src/main/res/mipmap-anydpi-v26/*.png
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            dir="android/app/src/main/res/mipmap-$density"
            mkdir -p "$dir"
            convert -size 192x192 xc:"#3880ff" -fill white -draw "circle 96,96 96,20" PNG32:"$dir/ic_launcher.png"
            convert -size 192x192 xc:"#3880ff" -fill white -draw "circle 96,96 96,20" PNG32:"$dir/ic_launcher_round.png"
            convert -size 192x192 xc:none -fill white -draw "circle 96,96 96,20" PNG32:"$dir/ic_launcher_foreground.png"
          done
          find android/app/src/main/res -name "*splash*.png" | while read -r splash_file; do
            convert -size 480x800 xc:"#1a1b1f" PNG32:"$splash_file"
          done

      - name: Inject Keystore from Secret
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "=== Injecting Keystore ==="
          mkdir -p android/app
          node -e "
          const fs = require('fs');
          const b64 = process.env.RELEASE_KEYSTORE_BASE64;
          const target = 'android/app/release.keystore';
          if (b64 && b64.trim().length > 100) {
            console.log('Writing keystore from GitHub Secret...');
            fs.writeFileSync(target, Buffer.from(b64.trim(), 'base64'));
          } else if (fs.existsSync(target)) {
            console.log('Using existing local keystore file.');
          } else {
            console.error('ERROR: Keystore missing! No secret and no local file found.');
            process.exit(1);
          }
          "
          ls -la android/app/release.keystore

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x android/gradlew

      - name: Build Signed AAB and APK
        run: |
          cd android
          echo "=== Running Gradle Build ==="
          ./gradlew bundleRelease assembleRelease --no-daemon -Pandroid.suppressUnsupportedCompileSdk=36

      - name: Verify Signatures
        run: |
          echo "=== Verifying AAB Signature ==="
          AAB_FILE=$(find android/app/build/outputs/bundle/release -name "*.aab" | head -n 1)
          jarsigner -verify -verbose -certs "$AAB_FILE" | grep -i "jar verified"
          
          echo "=== Verifying APK Signature ==="
          APK_FILE=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          jarsigner -verify -verbose -certs "$APK_FILE" | grep -i "jar verified"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Release-Builds
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/release/*.apk
          retention-days: 30
