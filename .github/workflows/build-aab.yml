name: Build Signed Android AAB & APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-aab-apk:
    name: Build & Sign AAB and APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Node Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Production Bundle
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Complete Resource Sanitize
        run: |
          echo "=== Sanitizing Resources ==="
          sudo apt-get update && sudo apt-get install -y imagemagick
          rm -rf android/app/src/main/res/mipmap-anydpi-v26/*.png
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            dir="android/app/src/main/res/mipmap-$density"
            mkdir -p "$dir"
            convert -size 192x192 xc:"#3880ff" -fill white -draw "circle 96,96 96,20" PNG32:"$dir/ic_launcher.png"
            convert -size 192x192 xc:"#3880ff" -fill white -draw "circle 96,96 96,20" PNG32:"$dir/ic_launcher_round.png"
            convert -size 192x192 xc:none -fill white -draw "circle 96,96 96,20" PNG32:"$dir/ic_launcher_foreground.png"
          done
          find android/app/src/main/res -name "*splash*.png" | while read -r splash_file; do
            convert -size 480x800 xc:"#1a1b1f" PNG32:"$splash_file"
          done

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x android/gradlew

      - name: Build Unsigned AAB and APK
        run: |
          cd android
          echo "=== Building Unsigned Artifacts (Safe Build) ==="
          ./gradlew clean bundleRelease assembleRelease --no-daemon -Pandroid.suppressUnsupportedCompileSdk=36

      - name: Manual Signing (Jarsigner)
        run: |
          KEYSTORE="android/app/release.keystore"
          STOREPASS="almayadin123"
          ALIAS="almayadin"
          
          echo "=== Starting Manual Signing Process ==="
          
          # Check if keystore exists
          if [ ! -f "$KEYSTORE" ]; then
            echo "ERROR: release.keystore not found at $KEYSTORE"
            exit 1
          fi
          
          # Sign AAB
          AAB_FILE=$(find android/app/build/outputs/bundle/release -name "*-release.aab" -o -name "*-unsigned.aab" | head -n 1)
          if [ -z "$AAB_FILE" ]; then 
            AAB_FILE=$(find android/app/build/outputs/bundle/release -name "*.aab" | head -n 1)
          fi
          
          if [ -n "$AAB_FILE" ]; then
            echo "Signing AAB: $AAB_FILE"
            jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
              -keystore "$KEYSTORE" -storepass "$STOREPASS" -keypass "$STOREPASS" \
              "$AAB_FILE" "$ALIAS"
          else
            echo "AAB file not found for signing"
            exit 1
          fi

          # Sign APK
          APK_FILE=$(find android/app/build/outputs/apk/release -name "*-release-unsigned.apk" -o -name "*-unsigned.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          fi

          if [ -n "$APK_FILE" ]; then
            echo "Signing APK: $APK_FILE"
            jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
              -keystore "$KEYSTORE" -storepass "$STOREPASS" -keypass "$STOREPASS" \
              "$APK_FILE" "$ALIAS"
          fi

          echo "=== Verifying Signatures ==="
          jarsigner -verify -verbose -certs "$AAB_FILE" | grep -i "jar verified" || exit 1
          
          mkdir -p final-artifacts
          cp "$AAB_FILE" final-artifacts/app-release.aab
          if [ -n "$APK_FILE" ]; then
            cp "$APK_FILE" final-artifacts/app-release.apk
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Release-Builds
          path: final-artifacts/
          retention-days: 30
