name: Build Signed Android AAB & APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-aab-apk:
    name: Build & Sign AAB and APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Node Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Production Bundle
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Complete Resource Sanitize
        run: |
          echo "=== Sanitizing Resources ==="
          sudo apt-get update && sudo apt-get install -y imagemagick
          rm -rf android/app/src/main/res/mipmap-anydpi-v26/*.png
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            dir="android/app/src/main/res/mipmap-$density"
            mkdir -p "$dir"
            convert -size 192x192 xc:"#3880ff" -fill white -draw "circle 96,96 96,20" PNG32:"$dir/ic_launcher.png"
            convert -size 192x192 xc:"#3880ff" -fill white -draw "circle 96,96 96,20" PNG32:"$dir/ic_launcher_round.png"
            convert -size 192x192 xc:none -fill white -draw "circle 96,96 96,20" PNG32:"$dir/ic_launcher_foreground.png"
          done
          find android/app/src/main/res -name "*splash*.png" | while read -r splash_file; do
            convert -size 480x800 xc:"#1a1b1f" PNG32:"$splash_file"
          done

      - name: Validate Keystore
        run: |
          KEYSTORE="android/app/release.keystore"
          if [ ! -f "$KEYSTORE" ]; then
            echo "CRITICAL ERROR: release.keystore file NOT found in android/app/"
            exit 1
          fi
          FILE_SIZE=$(stat -c%s "$KEYSTORE")
          echo "Keystore size: $FILE_SIZE bytes"
          if [ "$FILE_SIZE" -lt 100 ]; then
            echo "CRITICAL ERROR: release.keystore is too small or corrupt. Please re-upload it."
            exit 1
          fi

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x android/gradlew

      - name: Build and Sign (Official Gradle Path)
        run: |
          cd android
          STOREPASS="almayadin123"
          ALIAS="almayadin"
          KEYPASS="almayadin123"
          
          echo "=== Starting Build ==="
          ./gradlew bundleRelease assembleRelease --no-daemon \
            -PRELEASE_STORE_PASSWORD="$STOREPASS" \
            -PRELEASE_KEY_ALIAS="$ALIAS" \
            -PRELEASE_KEY_PASSWORD="$KEYPASS" \
            -Pandroid.suppressUnsupportedCompileSdk=36

      - name: Verify Signatures
        run: |
          echo "=== Verifying AAB Signature ==="
          AAB_FILE=$(find android/app/build/outputs/bundle/release -name "*.aab" | head -n 1)
          jarsigner -verify -verbose -certs "$AAB_FILE" | grep -i "jar verified" || (echo "Verification Failed"; exit 1)
          
          echo "=== Verifying APK Signature ==="
          APK_FILE=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          jarsigner -verify -verbose -certs "$APK_FILE" | grep -i "jar verified" || (echo "Verification Failed"; exit 1)

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Release-Builds
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/release/*.apk
          retention-days: 30
